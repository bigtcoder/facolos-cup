body:"<h3>Who we are</h3><p>The VPA (Vietnam Pickleball Alliance) pages on papifinals.com are run by the Papi Point Finals organisers, who act as the data controller.</p><h3>What we process</h3><ul><li><b>Public rating data:</b> display name, gender category, city if public, and ratings published by public rating systems (DUPR, PVNA, VDPR, PICKNA, LOOL and others), with links to the public source.</li><li><b>Results you play in VPA events:</b> teams, scores, dates, and the VPA level computed from them.</li><li><b>Registrations:</b> team and player names, the VPA level snapshot and payment status. The contact you give (email/Zalo) is visible only to organisers.</li><li><b>Organiser accounts:</b> an email address for sign-in.</li></ul><p>We <b>never</b> collect or publish phone numbers, ID/CCCD numbers, birthdays or IP-based profiles, and we do not hold payment funds (VietQR transfers go straight to the organiser's bank account).</p><h3>Why (legal basis)</h3><p>Running and ranking pickleball events, fair division placement, and integrity checks. Registration data is processed with your consent, given on the registration form. You can withdraw consent at any time.</p><h3>Where and how long</h3><p>Data is stored in Vietnam-accessible infrastructure under organiser control. Contacts are deleted after the event or the request is handled; results are kept for ranking history unless you ask for removal. Every result edit is audit-logged.</p><h3>Your rights (Decree 13, Art. 9)</h3><p>You may ask to see, correct, delete or restrict your data, object to the public ranking, or withdraw consent. Use the form below; we reply within 72 hours. A removed player is shown as \"Hidden player\" in past results so the other players' records stay correct.</p>"},
vi:{nRank:"Xếp hạng VPA",nRes:"Kết quả",nConv:"Quy đổi điểm trình",h:"Chính sách quyền riêng tư",ver:"Phiên bản privacy-2026-11-03 · Nghị định 13/2023/NĐ-CP về bảo vệ dữ liệu cá nhân",fh:"Yêu cầu gỡ, sửa hoặc không công khai",fn:"Tên của bạn như đang hiển thị",fw:"Xuất hiện ở đâu (trang / giải / đường dẫn)",fr:"Yêu cầu",o1:"Gỡ thông tin của tôi",o2:"Sửa dữ liệu của tôi",o3:"Không hiển thị trên bảng xếp hạng",o4:"Cho tôi xem dữ liệu đang lưu",fd:"Chi tiết",fc:"Liên hệ để phản hồi (email hoặc Zalo — chỉ BTC xem, xoá sau khi xử lý)",send:"Gửi yêu cầu",need:"Cần tên và thông tin liên hệ.",ok:"Đã nhận ✓ BTC sẽ xử lý, thường trong 72 giờ.",
body:"<h3>Chúng tôi là ai</h3><p>Các trang VPA (Vietnam Pickleball Alliance) trên papifinals.com do BTC Papi Point Finals vận hành, là bên kiểm soát dữ liệu.</p><h3>Dữ liệu được xử lý</h3><ul><li><b>Điểm trình công khai:</b> tên hiển thị, nhóm giới tính, thành phố nếu công khai, và điểm trình do các hệ thống công khai (DUPR, PVNA, VDPR, PICKNA, LOOL…) công bố, kèm đường dẫn nguồn.</li><li><b>Kết quả thi đấu tại giải VPA:</b> đội, tỉ số, ngày và trình VPA tính từ đó.</li><li><b>Đăng ký:</b> tên đội và VĐV, trình VPA được chốt và trạng thái thanh toán. Thông tin liên hệ (email/Zalo) chỉ BTC xem được.</li><li><b>Tài khoản BTC:</b> email để đăng nhập.</li></ul><p>Chúng tôi <b>không bao giờ</b> thu thập hay công khai số điện thoại, số CCCD/giấy tờ, ngày sinh hay hồ sơ theo IP, và không giữ tiền (chuyển khoản VietQR đi thẳng vào tài khoản của BTC).</p><h3>Mục đích (cơ sở pháp lý)</h3><p>Tổ chức và xếp hạng giải pickleball, xếp hạng đấu công bằng và kiểm tra tính trung thực. Dữ liệu đăng ký được xử lý dựa trên sự đồng ý của bạn trong form đăng ký; bạn có thể rút lại bất cứ lúc nào.</p><h3>Lưu trữ</h3><p>Dữ liệu do BTC kiểm soát. Thông tin liên hệ được xoá sau giải hoặc sau khi xử lý yêu cầu; kết quả được giữ để tính lịch sử xếp hạng trừ khi bạn yêu cầu gỡ. Mọi chỉnh sửa kết quả đều được ghi nhật ký.</p><h3>Quyền của bạn (Điều 9, NĐ 13)</h3><p>Bạn có quyền xem, sửa, xoá, hạn chế xử lý, phản đối việc công khai xếp hạng hoặc rút lại đồng ý. Dùng form bên dưới; chúng tôi phản hồi trong 72 giờ. VĐV đã gỡ sẽ hiển thị là \"VĐV ẩn\" trong kết quả cũ để giữ đúng thành tích của người khác.</p>"}};</script>
